name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    strategy:
      matrix:
        go-version: ['1.27.x', 'stable']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Record environment
        run: |
          go version
          uname -sr

      - name: Format check
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Module tidy check
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test with race detection
        run: go test -timeout 120s -race -count=1 ./...

      - name: Coverage
        if: matrix.go-version == '1.27.x'
        run: go test -timeout 120s -covermode=atomic -coverprofile=coverage.out -count=1 ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.go-version == '1.27.x'
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: go build ./...

      - name: Cross-architecture build
        run: |
          for arch in amd64 arm64 riscv64 loong64; do
            echo "Building for linux/$arch..."
            GOOS=linux GOARCH=$arch go build ./...
          done
